<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="CWA Help Desk Appointment Form">
    <meta name="keywords" content="CWA, Help Desk, Appointment, Swinburne">
    <meta name="author" content="Manahil Baig">

    <title>CWA Help Desk Appointment</title>
</head>

<body>
<a href="http://www.swin.edu.au">
<img src="logo.png" alt="Swinburne University Logo">
</a>

<h1>CWA Help Desk Appointment</h1>

<p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
<p> Check Blackboard for when CWA tutors will be there. </p>

<form method="post" action="#">

<fieldset> <legend>Student details</legend> 

<label for="studentID">Student ID</label>

<input
    type="text"
    id="studentID"
    name="studentID"
    required
    pattern="[0-9]{7,10}">

    <p>
        <label for="givenName">Given Name</label>

        <input 
               type="text"
               id="givenName"
               name="givenName"
               maxlength="15"
               required
               pattern="[A-Za-z]+">


        <label for="familyName">Family Name</label>

        <input 
               type="text"
               id="familyName"
               name="familyName"
               maxlength="15"
               required
               pattern="[A-Za-z]+">
    </p>
</fieldset>

<fieldset>

    <legend>Your unit</legend>

    <p>

        <input
            type="radio"
            id="cos10011"
            name="unit"
            value="COS10011"
            required
        >
        <label for="cos10011">COS10011</label>


        <input
            type="radio"
            id="cos60004"
            name="unit"
            value="COS60004"
        >
        <label for="cos60004">COS60004</label>


        <input
            type="radio"
            id="cos60007"
            name="unit"
            value="COS60007"
        >
        <label for="cos60007">COS60007</label>

    </p>

    <p>

        <label for="tutor">Your Tutor</label>

        <select id="tutor" name="tutor" required>

            <option value="">Please Select</option>
            <option value="Hussien Nafee">Hussien Nafee</option>
            <option value="Khadija Boussaha">Khadija Boussaha</option>
            <option value="Mubashir Khan">Mubashir Khan</option>

        </select>

    </p>

</fieldset>

<fieldset>

    <legend>Issue</legend>

    <p>

        <input
            type="checkbox"
            id="html"
            name="issue[]"
            value="HTML"
            checked="checked"
        >
        <label for="html">HTML</label>


        <input
            type="checkbox"
            id="css"
            name="issue[]"
            value="CSS"
        >
        <label for="css">CSS</label>


        <input
            type="checkbox"
            id="javascript"
            name="issue[]"
            value="JavaScript"
        >
        <label for="javascript">JavaScript</label>


        <input
            type="checkbox"
            id="php"
            name="issue[]"
            value="PHP"
        >
        <label for="php">PHP</label>


        <input
            type="checkbox"
            id="mysql"
            name="issue[]"
            value="MySQL"
        >
        <label for="mysql">MySQL</label>

    </p>


    <p>

        <label for="description">Description of Issue</label>

        <textarea
            id="description"
            name="description"
            rows="5"
            cols="35"
            placeholder="Write description of your problem here..."
        ></textarea>

    </p>

</fieldset>

<fieldset>

    <legend>Preferred Date / Time</legend>

    <p>
        <label for="date">Date</label>

        <input
            type="text"
            id="date"
            name="date"
            placeholder="dd/mm/yyyy"
            pattern="\d{2}/\d{2}/\d{4}"
            required
        >
    </p>


    <p>
        <label for="time">Time</label>

        <input
            type="text"
            id="time"
            name="time"
            placeholder="00:00"
            pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]"
            required>
    </p>

</fieldset>

<p>
    <input type="submit" value="Book">
    <input type="reset" value="Reset form">
</p>

</form>
</body>

</html>
